name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # engines/05 R22, ADR 0016: the Tree-sitter helper for each platform (treesitter-helper.yml).
  helper:
    uses: ./.github/workflows/treesitter-helper.yml

  build:
    name: Build and test
    needs: helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # The plugin archive carries every platform's helper (engines/05 R26, R28).
      - uses: actions/download-artifact@v8
        with:
          pattern: treesitter-helper-*
          path: build/treesitter/helpers
      - name: Place the helpers
        run: |
          cd build/treesitter/helpers
          for dir in treesitter-helper-*; do mv "$dir" "${dir#treesitter-helper-}"; done
          chmod +x */smartdiff-treesitter || true
          ls -R

      - name: Build and test
        run: ./gradlew buildPlugin check

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests
          if-no-files-found: ignore

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/distributions/*.zip

  verify:
    name: Plugin Verifier (${{ matrix.ides }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ides: [idea, pycharm, rustrover]
    steps:
      # The verifier downloads one full IDE per version; make room on the runner.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify plugin
        run: ./gradlew verifyPlugin -Psmartdiff.verifier.ides=${{ matrix.ides }}

      - name: Upload verifier reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports-${{ matrix.ides }}
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
