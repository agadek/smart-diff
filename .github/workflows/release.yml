name: Release

# Publishing a GitHub release whose tag is v<pluginVersion> builds, tests, verifies and signs the plugin, attaches the
# signed zip to the release, and publishes it to the JetBrains Marketplace when the repository variable
# PUBLISH_TO_MARKETPLACE is "true". See docs/RELEASING.md.
on:
  release:
    types: [published]

jobs:
  helper:
    uses: ./.github/workflows/treesitter-helper.yml
    with:
      ref: ${{ github.event.release.tag_name }}

  release:
    name: Build, sign and publish
    needs: helper
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The verifier downloads one full IDE per version; make room on the runner.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches the plugin version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match pluginVersion $version in gradle.properties"
            exit 1
          fi

      # The plugin archive carries every platform's helper (engines/05 R26, R28).
      - uses: actions/download-artifact@v8
        with:
          pattern: treesitter-helper-*
          path: build/treesitter/helpers
      - name: Place the helpers
        run: |
          cd build/treesitter/helpers
          for dir in treesitter-helper-*; do mv "$dir" "${dir#treesitter-helper-}"; done
          chmod +x */smartdiff-treesitter || true
          ls -R

      - name: Build and test
        run: ./gradlew buildPlugin check

      # One family per invocation, as in CI, so each family gets only its own ignored problems
      # (languages/16-javascript-typescript-details §3, languages/17-go-details §3, languages/19-php-details §3,
      # languages/20-sql-details §3).
      - name: Verify plugin
        run: |
          for family in idea pycharm rustrover webstorm goland phpstorm datagrip; do
            ./gradlew verifyPlugin -Psmartdiff.verifier.ides="$family"
          done

      - name: Sign
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin

      - name: Attach the signed plugin to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/distributions/*-signed.zip

      - name: Publish to the JetBrains Marketplace
        if: ${{ vars.PUBLISH_TO_MARKETPLACE == 'true' }}
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Upload verifier reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
